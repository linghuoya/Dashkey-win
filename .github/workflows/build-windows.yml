name: Build Windows

on:
  push:
    branches: [main]
    paths:
      - 'Core/**'
      - 'Views/**'
      - 'Native/**'
      - 'Assets/**'
      - '*.cs'
      - '*.xaml'
      - '*.csproj'
      - 'app.manifest'
      - 'build.ps1'
      - '.github/workflows/build-windows.yml'
  pull_request:
    paths:
      - 'Core/**'
      - 'Views/**'
      - 'Native/**'
      - '*.cs'
      - '*.xaml'
      - '*.csproj'
      - 'build.ps1'
  workflow_dispatch:
    inputs:
      runtime:
        description: '目标架构（默认 win-x64）'
        required: false
        type: choice
        default: win-x64
        options:
          - win-x64
          - win-x86
          - win-arm64

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      # 单架构构建，push 触发时 github.event.inputs.runtime 为空，回落到 win-x64。
      # 用 -SelfContained 自带运行时，避免目标机缺 .NET 8 桌面运行时导致双击无反应。
      - name: Publish
        run: ./build.ps1 -Runtime ${{ github.event.inputs.runtime || 'win-x64' }} -SelfContained

      - uses: actions/upload-artifact@v6
        with:
          name: DashKey-${{ github.event.inputs.runtime || 'win-x64' }}
          path: Build/DashKey-${{ github.event.inputs.runtime || 'win-x64' }}/DashKey.exe
          if-no-files-found: error
