name: Build Windows

on:
  push:
    branches: [main]
    paths:
      - 'Core/**'
      - 'Views/**'
      - 'Native/**'
      - 'Assets/**'
      - '*.cs'
      - '*.xaml'
      - '*.csproj'
      - 'app.manifest'
      - 'build.ps1'
      - '.github/workflows/build-windows.yml'
  pull_request:
    paths:
      - 'Core/**'
      - 'Views/**'
      - 'Native/**'
      - '*.cs'
      - '*.xaml'
      - '*.csproj'
      - 'build.ps1'
  workflow_dispatch:
    inputs:
      runtime:
        description: '目标架构（默认 win-x86；临时需要 x64 时手动选）'
        required: false
        type: choice
        default: win-x86
        options:
          - win-x86
          - win-x64
          - win-arm64

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      # 目前只出 win-x86 单架构。push 触发时 inputs.runtime 为空，回落到 win-x86。
      - name: Publish
        run: ./build.ps1 -Runtime ${{ github.event.inputs.runtime || 'win-x86' }} -SelfContained

      - uses: actions/upload-artifact@v6
        with:
          name: DashKey-${{ github.event.inputs.runtime || 'win-x86' }}
          path: Build/DashKey-${{ github.event.inputs.runtime || 'win-x86' }}/DashKey.exe
          if-no-files-found: error
